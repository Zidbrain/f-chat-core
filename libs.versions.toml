[versions]
koin = "4.1.0-Beta8"
exposed = "0.60.0"
logback = "1.5.18"
mockk = "1.14.4"
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"
koin-annotations = "2.1.0"
testcontainers = "1.21.3"
jib = "3.4.5"
postgresql = "42.7.7"
kotlinxDatetime = "0.7.1"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
versions = { id = "com.github.ben-manes.versions", version = "0.52.0" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }

[libraries]
# koin
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-ktor = { module = "io.insert-koin:koin-ktor3"}
koin-test = { module = "io.insert-koin:koin-test" }
koin-test-junit5 = { module = "io.insert-koin:koin-test-junit5" }
koin-logger-slf4j = { module = "io.insert-koin:koin-logger-slf4j"}
koin-annotations-bom = { module = "io.insert-koin:koin-annotations-bom", version.ref = "koin-annotations" }
koin-annotations = { module = "io.insert-koin:koin-annotations"}
koin-annotations-ksp-compiler = { module = "io.insert-koin:koin-ksp-compiler", version.ref = "koin-annotations" }

kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version = "1.9.0" }

google-api-client = "com.google.api-client:google-api-client:2.8.0"

#firebase
firebase-admin = { module = "com.google.firebase:firebase-admin", version = "9.5.0" }

# db
hikaricp = "com.zaxxer:HikariCP:6.3.0"
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version = "11.10.2" }

# exposed
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-crypt = { module = "org.jetbrains.exposed:exposed-crypt", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }

h2 = "com.h2database:h2:2.3.232"
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# test
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
coroutines-debug = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-debug", version = "1.4.0" }
